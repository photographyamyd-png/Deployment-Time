<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLC — Stats ST3 Master (Dark Editorial Counter Band)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Tokens (aligned with glc-base.css :root) ── */
    :root {
      --charcoal-deep: #1E1C1A;
      --white: #FFFFFF;
      --yellow-core: #F2B705;
      --font-display: 'Oswald', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --ease-expo: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      font-size: 16px;
      color: #0E0D0C;
      background: #fff;
      line-height: 1.6;
    }

    /* ═══ STATS — v3 Dark Editorial Counter Band (extract) ═══ */
    #stats {
      background: var(--charcoal-deep);
      position: relative;
      overflow: hidden;
    }

    #stats::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg, transparent, transparent 79px,
          rgba(255,255,255,0.012) 79px, rgba(255,255,255,0.012) 80px
        ),
        repeating-linear-gradient(
          0deg, transparent, transparent 79px,
          rgba(255,255,255,0.012) 79px, rgba(255,255,255,0.012) 80px
        );
      pointer-events: none;
    }

    .st3__top-rail {
      height: 3px;
      background: linear-gradient(90deg, var(--yellow-core) 0%, rgba(242,183,5,0.12) 45%, transparent 100%);
      position: relative;
      z-index: 2;
    }

    .st3__inner {
      display: flex;
      align-items: stretch;
      position: relative;
      z-index: 1;
    }

    .st3__side-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-right: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      width: 56px;
    }

    .st3__side-label span {
      display: block;
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 800;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    .st3__grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      flex: 1;
    }

    .stat-cell {
      padding: 56px 32px;
      border-right: 1px solid rgba(255,255,255,0.06);
      position: relative;
      text-align: center;
      transition: background 0.3s var(--ease-expo);
    }

    .stat-cell:last-child { border-right: none; }

    .stat-cell::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--yellow-core);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s var(--ease-expo);
    }

    .stat-cell:hover::after { transform: scaleX(1); }
    .stat-cell:hover { background: rgba(255,255,255,0.025); }

    .stat-cell__num {
      font-family: var(--font-display);
      font-size: clamp(52px, 5vw, 80px);
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      letter-spacing: -0.04em;
      display: block;
    }

    .stat-cell__num > span:last-child {
      color: var(--yellow-core) !important;
    }

    .stat-cell__label {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 12px;
      display: block;
    }

    .stat-cell__sub {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.25);
      margin-top: 5px;
      letter-spacing: 0.02em;
    }

    @media (max-width: 1024px) {
      .st3__side-label { display: none; }
      .st3__grid { grid-template-columns: repeat(2, 1fr); }
      .stat-cell { padding: 48px 24px; }
    }

    @media (max-width: 640px) {
      .stat-cell { padding: 40px 16px; }
      .stat-cell__num { font-size: clamp(44px, 11vw, 60px); }
    }

    /* Scroll reveal (matches glc-base; file uses .visible for instant preview) */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.6s var(--ease-expo), transform 0.6s var(--ease-expo);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal--delay-1 { transition-delay: 0.1s; }
    .reveal--delay-2 { transition-delay: 0.2s; }
    .reveal--delay-3 { transition-delay: 0.3s; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main id="main-content">
    <!-- Mirrors glc-site StatsSection + StatCellAnimated structure (numbers static for file portability) -->
    <section id="stats" aria-label="Company statistics">
      <div class="st3__top-rail" aria-hidden="true"></div>

      <div class="st3__inner">
        <div class="st3__side-label" aria-hidden="true">
          <span>Performance</span>
        </div>

        <div class="st3__grid">
          <div class="reveal visible stat-cell">
            <span class="stat-cell__num"><span>15</span><span>+</span></span>
            <span class="stat-cell__label">Years of Experience</span>
            <span class="stat-cell__sub">Field-proven expertise</span>
          </div>
          <div class="reveal visible reveal--delay-1 stat-cell">
            <span class="stat-cell__num"><span>500</span><span>+</span></span>
            <span class="stat-cell__label">Projects Completed</span>
            <span class="stat-cell__sub">Commercial builds</span>
          </div>
          <div class="reveal visible reveal--delay-2 stat-cell">
            <span class="stat-cell__num"><span>4</span><span> Areas</span></span>
            <span class="stat-cell__label">Service Coverage</span>
            <span class="stat-cell__sub">Barrie, Midland, Orillia &amp; Simcoe</span>
          </div>
          <div class="reveal visible reveal--delay-3 stat-cell">
            <span class="stat-cell__num"><span>100</span><span>%</span></span>
            <span class="stat-cell__label">Project Satisfaction</span>
            <span class="stat-cell__sub">On time, every time</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
